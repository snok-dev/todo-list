<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <!-- The form where you type a new task -->
    <form id="task-form">
      <div class="form-row">
        <input id="task-input" type="text" placeholder="What do you need to do?" autocomplete="off">
        <button type="submit">Add</button>
      </div>

      <button type="button" id="toggle-options" class="link-button">+ Due date, duration &amp; repeat</button>

      <!-- Extra options, hidden until "toggle-options" is clicked -->
      <div id="options" hidden>
        <label>
          Due date
          <input id="due-input" type="date">
        </label>

        <label>
          Takes
          <span class="inline">
            <input id="duration-amount" type="number" min="0" step="any" placeholder="e.g. 30">
            <select id="duration-unit">
              <option value="min">minutes</option>
              <option value="hour">hours</option>
            </select>
          </span>
        </label>

        <label>
          Repeats
          <select id="repeat-select">
            <option value="none">Doesn't repeat</option>
            <option value="daily">Every day</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
            <option value="custom">Custom...</option>
          </select>
        </label>

        <label id="custom-repeat" hidden>
          Repeat every
          <span class="inline">
            <input id="repeat-every" type="number" min="1" value="2">
            <select id="repeat-unit">
              <option value="day">days</option>
              <option value="week">weeks</option>
              <option value="month">months</option>
            </select>
          </span>
        </label>

        <label id="until-label" hidden>
          Stop repeating after (optional)
          <input id="until-input" type="date">
        </label>
      </div>
    </form>

    <!-- Buttons to choose which tasks to show -->
    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">To do</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <!-- The tasks are added here by script.js -->
    <ul id="task-list"></ul>

    <footer>
      <span id="task-count"></span>
      <button id="clear-done" class="link-button">Clear done</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
